<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>Admin Login — ExamNest</title>
<link rel="icon" href="assets/icons/favicon.svg" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563EB" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<script src="./js/pwa.js" defer></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #eef3ff, var(--bg));
    padding: 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 40px 32px;
  }
  .auth-card__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    margin-bottom: 24px;
    justify-content: center;
  }
  .auth-card h1 {
    font-size: 1.3rem;
    text-align: center;
    margin-bottom: 6px;
  }
  .auth-card p.sub {
    text-align: center;
    color: var(--navy-60);
    font-size: 0.9rem;
    margin-bottom: 26px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    font-family: inherit;
    font-size: 0.95rem;
  }
  .field input:focus {
    border-color: var(--blue);
  }
  .form-error {
    background: rgba(239, 68, 68, 0.1);
    color: var(--error);
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    display: none;
  }
  .form-error.is-visible { display: block; }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 0.85rem;
    color: var(--navy-60);
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card__brand"><span class="brand__mark">EN</span>ExamNest</div>
    <h1>Admin sign in</h1>
    <p class="sub">Only the ExamNest administrator can access this area.</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn--primary btn--block" id="submitBtn">Sign In</button>
    </form>

    <a href="index.html" class="back-link">← Back to ExamNest</a>
  </div>
</div>

<script type="module">
  import { login, redirectIfAlreadyLoggedIn } from "./js/auth.js";
  import { $ } from "./js/utils.js";

  redirectIfAlreadyLoggedIn();

  const form = $("#loginForm");
  const errorBox = $("#formError");
  const submitBtn = $("#submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("is-visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    const email = $("#email").value.trim();
    const password = $("#password").value;

    try {
      await login(email, password);
      window.location.replace("dashboard.html");
    } catch (err) {
      errorBox.textContent = "Incorrect email or password. Please try again.";
      errorBox.classList.add("is-visible");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });
</script>
</body>
</html>
