<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exam Instructions — ExamNest</title>
<meta name="description" content="Read the rules, duration, marking scheme and auto-submit information before starting your ExamNest mock test." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#2563EB" />
<link rel="icon" href="assets/icons/favicon.svg" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<script src="./js/pwa.js" defer></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="brand"><span class="brand__mark">EN</span>ExamNest</a>
    <nav class="navbar__links">
      <a href="get-test.html" class="btn btn--ghost">Get Test</a>
      <a href="login.html" class="btn btn--primary">Admin Login</a>
      <button class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>
</header>

<main class="instructions-wrap" id="instructionsWrap">
  <div class="instructions-card"><div class="skeleton" style="height:420px;"></div></div>
</main>

<script type="module">
  import { db } from "./js/firebase.js";
  import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { $, qs, escapeHtml, initNavbar } from "./js/utils.js";
  import { clearExamSession } from "./js/storage.js";

  initNavbar(`
    <a href="get-test.html" class="btn btn--ghost btn--block">Get Test</a>
    <a href="login.html" class="btn btn--primary btn--block">Admin Login</a>
  `);

  const testId = qs("testId");
  const mode = qs("mode");
  const wrap = $("#instructionsWrap");

  // No testId at all — this page must never be opened on its own.
  if (!testId) {
    window.location.replace("get-test.html");
  } else {
    loadTest();
  }

  async function loadTest() {
    try {
      const snap = await getDoc(doc(db, "tests", testId));
      if (!snap.exists() || snap.data().status !== "published") {
        // Missing or unpublished test — bounce back rather than dead-end.
        window.location.replace("get-test.html");
        return;
      }
      const test = { id: snap.id, ...snap.data() };
      const qSnap = await getDocs(collection(db, "tests", testId, "questions"));
      render(test, qSnap.size);
    } catch (err) {
      console.error(err);
      wrap.innerHTML = `
        <div class="instructions-card" style="text-align:center;">
          <h1>Couldn't load this test</h1>
          <p style="color:var(--navy-60);margin:10px 0 20px;">Please check your connection and try again.</p>
          <a href="get-test.html" class="btn btn--primary">Back to tests</a>
        </div>`;
    }
  }

  function render(test, questionCount) {
    const negMarkText = test.negativeMarking
      ? `${test.negativeMarking} mark(s) will be deducted for every wrong answer.`
      : "There is no negative marking on this test — wrong answers score zero, not negative.";

    wrap.innerHTML = `
      <div class="instructions-card">
        <span class="eyebrow-badge">📋 Before you begin</span>
        <h1>${escapeHtml(test.title)}</h1>
        <p style="color:var(--navy-60);">${escapeHtml(test.description || "Read the guidelines below carefully before starting. Once the timer begins, it cannot be paused.")}</p>

        <div class="instructions-meta">
          <div><strong>${questionCount}</strong><span>Questions</span></div>
          <div><strong>${test.duration ?? 0} min</strong><span>Duration</span></div>
          <div><strong>${test.negativeMarking ?? 0}</strong><span>Negative Marking</span></div>
        </div>

        <div class="instructions-section-title">Exam Rules</div>
        <ul class="instructions-rules">
          <li>The timer starts the moment you click <strong>Start Test</strong> and cannot be paused or restarted.</li>
          <li>Each question offers four options — select one, then use <strong>Save &amp; Next</strong> to record it and move on, or <strong>Mark for Review</strong> to flag it and come back later.</li>
          <li>${negMarkText}</li>
          <li>Your answers are auto-saved as you go, so a brief connection drop or accidental refresh won't lose your progress.</li>
          <li>You can navigate freely between questions using <strong>Previous/Next</strong> or the question palette, in any order, until you submit.</li>
          <li>When the timer reaches zero, the test <strong>auto-submits</strong> exactly as it stands — unattempted questions are scored as unattempted.</li>
          <li>Once submitted, answers are locked and cannot be changed — including with the browser Back button.</li>
        </ul>

        <div class="instructions-security">
          <strong>🔒 Exam integrity monitoring.</strong> To keep results fair for everyone, this test tracks tab switches, and disables right-click and common developer-tools shortcuts while it's in progress. This doesn't collect any personal data beyond your answers — it simply helps flag irregular activity. We recommend using a stable connection and staying on this tab for the full duration.
        </div>

        <label class="instructions-ack">
          <input type="checkbox" id="ackCheckbox" />
          <span>I have read and understood all the instructions above, and I'm ready to begin.</span>
        </label>

        <button class="btn btn--primary btn--block" id="startBtn" disabled>Start Test</button>
      </div>
    `;

    const checkbox = $("#ackCheckbox");
    const startBtn = $("#startBtn");
    checkbox.addEventListener("change", () => {
      startBtn.disabled = !checkbox.checked;
    });
   startBtn.addEventListener("click", () => {
  // Always preserve the exact testId received in the URL.
  if (mode === "retest") {
    clearExamSession(testId);
  }

  sessionStorage.setItem(
    "examnest_instructions_ack_" + testId,
    "1"
  );

  window.location.href =
    `exam.html?testId=${encodeURIComponent(testId)}`;
});
  }
</script>
</body>
</html>
