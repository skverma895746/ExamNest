<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>Exam in progress — ExamNest</title>
<link rel="icon" href="assets/icons/favicon.svg" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563EB" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<script src="./js/pwa.js" defer></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/exam.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="exam-body">
<div id="examRoot">
  <div class="exam-loading">
    <div class="exam-loading__logo">EN</div>
    <div class="exam-loading__spinner"></div>
    <p class="exam-loading__text">Preparing your exam…</p>
    <p class="exam-loading__subtext">Loading questions and starting a secure session. Please don't refresh this page.</p>
  </div>
</div>

<script type="module">
  import { initExam } from "./js/exam.js";
  initExam();
  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
});

// F12 aur shortcuts band
document.addEventListener("keydown", (e) => {
    if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && e.key === "I") ||
        (e.ctrlKey && e.shiftKey && e.key === "J") ||
        (e.ctrlKey && e.key === "U")
    ) {
        e.preventDefault();
    }
});
</script>
</body>
</html>
