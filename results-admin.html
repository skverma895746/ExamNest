<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>Results — ExamNest Admin</title>
<link rel="icon" href="assets/icons/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="adminMain" class="admin-main">
  <div class="admin-header">
    <div>
      <h1>Results</h1>
      <p>Every attempt submitted across all tests.</p>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="stat-card__label">Total Attempts</div><div class="stat-card__value" id="statAttempts">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Average Score</div><div class="stat-card__value" id="statAvgScore">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Average Accuracy</div><div class="stat-card__value" id="statAvgAccuracy">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Average Time Used</div><div class="stat-card__value" id="statAvgTime">—</div></div>
  </div>

  <div class="panel">
    <div class="panel__head">
      <h2>All Attempts</h2>
      <select id="testFilter" style="padding:9px 14px;border-radius:12px;border:1.5px solid var(--border);">
        <option value="">All tests</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Test</th><th>Score</th><th>Accuracy</th><th>Time Used</th><th>Submitted</th></tr>
        </thead>
        <tbody id="attemptsBody">
          <tr><td colspan="5">Loading attempts...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { guardAdminPage } from "./js/auth.js";
  import { renderShell } from "./js/dashboard.js";
  import { db } from "./js/firebase.js";
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { $, formatDate, formatDuration, escapeHtml } from "./js/utils.js";

  let allAttempts = [];
  let testTitles = {};

  guardAdminPage().then(async () => {
    renderShell("results");
    await loadTestTitles();
    await loadAttempts();
    $("#testFilter").addEventListener("change", () => render(filterAttempts()));
  });

  async function loadTestTitles() {
    const snap = await getDocs(collection(db, "tests"));
    const options = [`<option value="">All tests</option>`];
    snap.forEach((d) => {
      testTitles[d.id] = d.data().title;
      options.push(`<option value="${d.id}">${escapeHtml(d.data().title)}</option>`);
    });
    $("#testFilter").innerHTML = options.join("");
  }

  async function loadAttempts() {
    try {
      const snap = await getDocs(collection(db, "attempts"));
      allAttempts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      updateStats(allAttempts);
      render(allAttempts);
    } catch (err) {
      console.error(err);
      $("#attemptsBody").innerHTML = `<tr><td colspan="5">Couldn't load attempts.</td></tr>`;
    }
  }

  function filterAttempts() {
    const testId = $("#testFilter").value;
    return testId ? allAttempts.filter((a) => a.testId === testId) : allAttempts;
  }

  function updateStats(list) {
    $("#statAttempts").textContent = list.length;
    if (!list.length) {
      $("#statAvgScore").textContent = "—";
      $("#statAvgAccuracy").textContent = "—";
      $("#statAvgTime").textContent = "—";
      return;
    }
    const avgScore = list.reduce((s, a) => s + (a.score || 0), 0) / list.length;
    const avgAcc = list.reduce((s, a) => s + (a.accuracy || 0), 0) / list.length;
    const avgTime = list.reduce((s, a) => s + (a.timeUsed || 0), 0) / list.length;
    $("#statAvgScore").textContent = avgScore.toFixed(1);
    $("#statAvgAccuracy").textContent = `${avgAcc.toFixed(1)}%`;
    $("#statAvgTime").textContent = formatDuration(Math.round(avgTime));
  }

  function render(list) {
    const tbody = $("#attemptsBody");
    if (!list.length) {
      tbody.innerHTML = `
        <tr><td colspan="5">
          <div class="empty-illustration">
            <div class="empty-illustration__icon">📊</div>
            <h3>No attempts yet</h3>
            <p>Once candidates start taking tests, their submissions will show up here.</p>
          </div>
        </td></tr>`;
      return;
    }
    tbody.innerHTML = list
      .sort((a, b) => (b.submittedAt?.seconds || 0) - (a.submittedAt?.seconds || 0))
      .map(
        (a) => `
        <tr>
          <td data-label="Test">${escapeHtml(testTitles[a.testId] || "Unknown test")}</td>
          <td data-label="Score">${a.score ?? "—"}</td>
          <td data-label="Accuracy">${a.accuracy != null ? a.accuracy.toFixed(1) + "%" : "—"}</td>
          <td data-label="Time Used">${a.timeUsed != null ? formatDuration(a.timeUsed) : "—"}</td>
          <td data-label="Submitted">${a.submittedAt ? formatDate(new Date(a.submittedAt.seconds * 1000)) : "—"}</td>
        </tr>`
      )
      .join("");
  }
</script>
</body>
</html>
